openapi: 3.0.3
info:
  title: LiLi · API
  version: 0.5.1
  description: |
    Referencia del contrato HTTP actual de LiLi, pensada para volver al proyecto
    después de un tiempo y entender sus decisiones sin empezar por el código.

    El acceso empieza en `GET /auth/google`: el navegador pasa por Google y
    vuelve a `/auth/google/callback`. Si la identidad está permitida, LiLi crea
    una sesión local en una cookie HttpOnly y redirige a `/` en `APP_ORIGIN`,
    la entrada del frontend. Este consulta `/auth/me` para recuperar el usuario.
    Las rutas privadas validan esa cookie. Las peticiones que modifican estado
    también deben proceder del origen configurado en `APP_ORIGIN`.

    Las rutas de tareas requieren una sesión local. Cada operación obtiene el
    usuario de esa sesión y limita el acceso a sus tareas visibles; no permite
    elegir un propietario desde el cuerpo. Las escrituras requieren `Origin`
    igual a `APP_ORIGIN` o, si falta, un `Referer` del mismo origen.

    Las tareas admiten un nivel de subtareas, estados manuales, fechas locales
    en `Europe/Madrid` y eliminación física o lógica según su estado.
    `reminder` programa un aviso independiente del inicio y del fin cuando
    `REMINDERS_ENABLED=true` y el envío por Gmail está configurado. El destinatario
    es el correo de Google guardado para el propietario; la petición no permite
    elegir otra dirección. Sin hora explícita, se envía a las 06:00 de Madrid.
    El proceso revisa al arrancar y espera 30 segundos entre revisiones terminadas.
    Recupera avisos retrasados hasta 24 horas; los anteriores caducan. Los fallos
    temporales reintentan tras 1, 5, 15 y 60 minutos; los permanentes no reintentan.
    Cambiar la fecha programa un nuevo aviso; repetir la misma no lo rearma.
    Quitarla o completar, cancelar o borrar la tarea anula los envíos pendientes,
    pero no puede retirar un correo cuyo envío ya está en curso.
    Un reinicio tras la aceptación SMTP y antes de guardar el resultado puede
    provocar un duplicado. Aceptación SMTP no garantiza recepción en la bandeja.
    La respuesta HTTP confirma el guardado de la tarea, no el envío del aviso;
    los estados de envío permanecen internos y no se exponen en estas rutas.

tags:
  - name: Autenticación
    description: Inicio de sesión con Google y sesión local de LiLi.
  - name: Tareas
    description: Gestión de tareas y subtareas del usuario de la sesión.
paths:
  /auth/google:
    $ref: ./paths/auth/google.yaml
  /auth/google/callback:
    $ref: ./paths/auth/google-callback.yaml
  /auth/me:
    $ref: ./paths/auth/me.yaml
  /auth/logout:
    $ref: ./paths/auth/logout.yaml
  /tasks:
    $ref: ./paths/tasks/tasks.yaml
  /tasks/{uuid}:
    $ref: ./paths/tasks/task.yaml
  /tasks/{uuid}/status:
    $ref: ./paths/tasks/task-status.yaml
components:
  schemas:
    AuthMeResponse:
      $ref: ./components/schemas/auth-me-response.yaml
    TaskResponse:
      $ref: ./components/schemas/tasks/task.yaml
    TaskDate:
      $ref: ./components/schemas/tasks/task-date.yaml
    TaskDateInput:
      $ref: ./components/schemas/tasks/task-date-input.yaml
    TaskStatus:
      $ref: ./components/schemas/tasks/task-status.yaml
    CreateTask:
      $ref: ./components/schemas/tasks/create-task.yaml
    UpdateTaskDetails:
      $ref: ./components/schemas/tasks/update-task-details.yaml
    UpdateTaskStatus:
      $ref: ./components/schemas/tasks/update-task-status.yaml
    DeleteResponse:
      $ref: ./components/schemas/delete-response.yaml
    HttpError:
      $ref: ./components/schemas/http-error.yaml
  securitySchemes:
    sessionCookie:
      $ref: ./components/security-schemes/session-cookie.yaml
