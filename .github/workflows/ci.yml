name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
        env:
          DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
      - run: pnpm typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
        env:
          DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
      - run: pnpm run build

  test:
    name: Test coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - run: pnpm install --frozen-lockfile
      - run: NODE_ENV=test pnpm prisma generate
      - uses: actions/setup-python@v5
        if: github.event_name == 'pull_request'
        with:
          python-version: '3.12'
      - run: pnpm test:coverage
      - name: Diff coverage
        if: >-
          !cancelled() && github.event_name == 'pull_request' &&
          hashFiles('coverage/lcov.info') != ''
        run: |
          python -m pip install diff-cover==7.4.0
          diff-cover coverage/lcov.info --compare-branch=origin/main --fail-under=80
